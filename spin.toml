spin_manifest_version = 2

[application]
name = "weather-edge"
version = "0.1.0"
authors = ["beiler"]
description = ""

[[trigger.http]]
route = "/..."
component = "weather"

[component.weather]
source = "target/wasm32-wasip1/release/weather.wasm"
allowed_outbound_hosts = [
    "http://ip-api.com", 
    "https://api.weather.gov",
    "http://trending.spin.internal"
]
# Only the default store is declared here
key_value_stores = ["default"]

[component.weather.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]

[[trigger.http]]
route = { private = true }
component = "trending"

[component.trending]
source = "target/wasm32-wasip1/release/trending.wasm"

[component.trending.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
