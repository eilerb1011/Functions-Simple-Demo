[package]
name = "weather-edge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "weather"
path = "src/weather.rs"

[[bin]]
name = "trending"
path = "src/trending.rs"

[dependencies]
anyhow = "1.0"
spin-sdk = "3.0" # or your current spin-sdk version
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
